name: Pipeline

# Pull request: só valida (testes e build). Push na main (ou seja, depois do merge): valida e implanta.
# Há um único ambiente (production), no Railway. O banco é o Postgres da Aiven, configurado no próprio Railway.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma execução por ref: um push novo cancela a validação anterior do mesmo PR/branch.
# O deploy tem a própria trava (veja o job `deploy`), que nunca cancela um deploy em andamento.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILWAY_SERVICE: daily-app
  APP_URL: https://daily-app-production-b30a.up.railway.app

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres descartável: os testes recriam as tabelas a cada teste, então NUNCA aponte isto para a Aiven.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    name: Frontend (build Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build

  docker:
    name: Imagem de produção (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Railway)
    # Só depois do merge: nunca em pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ env.APP_URL }}
    # Dois merges seguidos esperam na fila em vez de se atropelarem; o deploy em andamento nunca é cancelado.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Token de PROJETO do Railway (ambiente production). Cadastre em Settings > Secrets and variables > Actions.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @railway/cli@5

      - name: Confere o token do Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret RAILWAY_TOKEN não configurado (token de projeto do Railway)."
            exit 1
          fi
          railway service status --service "$RAILWAY_SERVICE" --json

      - name: Guarda o deploy atual
        id: before
        run: |
          id=$(railway deployment list --service "$RAILWAY_SERVICE" --limit 1 --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"] if d else "none")')
          echo "previous=$id" >> "$GITHUB_OUTPUT"

      - name: Envia o código e acompanha o build
        run: railway up --ci --service "$RAILWAY_SERVICE"

      - name: Espera o novo deploy ficar no ar
        run: sh scripts/wait-railway-deploy.sh "${{ steps.before.outputs.previous }}" "$RAILWAY_SERVICE"

      - name: Teste de fumaça (app e banco)
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$APP_URL/api/health"
          echo
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$APP_URL/api/health/db"
          echo
