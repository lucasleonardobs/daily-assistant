[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-assincrona"
version = "0.1.0"
description = "Assistente de daily assíncrona (MVP) — ADK 2 + Gemini (Vertex AI)"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.11,<3",
    "sqlalchemy>=2,<3",
    "pydantic-settings>=2.4",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

# `app` e `agents` ficam importáveis em qualquer lugar (uvicorn, adk web, pytest).
[tool.setuptools.packages.find]
include = ["app*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
